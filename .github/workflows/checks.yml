name: Public workbench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Serve and check public snapshots
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory simulator/public > /tmp/blackhole-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/workbench.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/workbench.html > /dev/null
          npm run test:release
        env:
          PLAYWRIGHT_CHANNEL: chromium
          WORKBENCH_DISABLE_WEBGL: '1'
